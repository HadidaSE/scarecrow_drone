[pytest]
# Pytest configuration for Scarecrow Drone tests

# Test paths
testpaths =
    backend
    detection

# Python paths
pythonpath =
    ../scarecrow-drone/backend
    ../live_detection

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode
asyncio_mode = auto

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require more setup)
    slow: Slow running tests
    asyncio: Async tests

# Ignore patterns
norecursedirs =
    .git
    node_modules
    __pycache__
    .pytest_cache

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
